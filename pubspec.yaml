name: sonopay
description: "Gestión inteligente de notificaciones de pago por voz para negocios."
publish_to: 'none'

version: 1.4.0+6

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  
  # DI
  get_it: ^8.3.0
  injectable: ^2.7.1+4
  
  # Navigation
  go_router: ^14.8.1
  
  # Local Storage
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  
  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  
  # Payment Gateways
  webview_flutter: ^4.10.0
  
  # Utilities
  logger: ^2.4.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  device_info_plus: ^11.5.0
  shared_preferences: ^2.4.23
  connectivity_plus: ^6.1.5
  workmanager: ^0.9.0
  url_launcher: ^6.3.2
  permission_handler: ^11.4.0
  excel: ^4.0.3
  open_filex: ^4.7.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  jwt_decoder: ^2.0.1
  google_fonts: ^6.2.1
  path: ^1.9.1
  crypto: ^3.0.6
  google_sign_in: ^6.2.1
  firebase_core: ^3.1.1
  share_plus: ^10.1.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^2.6.2
  drift_dev: ^2.25.0

  # Performance & Production
  flutter_native_splash: ^2.4.1
  change_app_package_name: ^1.3.0
  icons_launcher: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#00BFA5"
  image: assets/images/splash.png
  android_12:
    color: "#00BFA5"
    image: assets/images/splash.png

icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
      adaptive_icon_background: "#00BFA5"
      adaptive_icon_foreground: "assets/images/icon.png"
    ios:
      enable: true
